---
- name: Stage private operator SSH configuration
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../group_vars/all.yml
    - ../group_vars/routers.yml
    - ../secrets/stealth.yml
  tasks:
    - ansible.builtin.include_role:
        name: router_management
        tasks_from: local

- name: Configure restricted management bastion
  hosts: vps_egress_hermes
  become: true
  gather_facts: false
  vars:
    ansible_host_key_checking: true
    ansible_ssh_common_args: "-o ForwardAgent=no -o StrictHostKeyChecking=yes -o UserKnownHostsFile={{ vault_router_management_local_known_hosts_path | quote }}"
  vars_files:
    - ../secrets/stealth.yml
  tasks:
    - ansible.builtin.include_role:
        name: router_management
        tasks_from: bastion

- name: Restrict router management after proving the bastion path
  hosts: routers
  gather_facts: false
  vars_files:
    - ../group_vars/all.yml
    - ../group_vars/routers.yml
    - ../secrets/stealth.yml
  vars:
    ansible_host_key_checking: true
    ansible_host: "{{ ghostroute_router_remote_host }}"
    ansible_user: "{{ ghostroute_router_remote_user }}"
    ansible_port: "{{ ghostroute_router_remote_port }}"
    ansible_ssh_private_key_file: "{{ vault_router_management_operator_key_path }}"
    ansible_ssh_common_args: "{{ vault_router_management_ansible_ssh_common_args }}"
  tasks:
    - ansible.builtin.include_role:
        name: router_management
        tasks_from: router

- name: Publish verified operator access profile
  hosts: localhost
  connection: local
  gather_facts: false
  vars_files:
    - ../secrets/stealth.yml
  tasks:
    - ansible.builtin.include_role:
        name: router_management
        tasks_from: publish

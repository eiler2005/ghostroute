---
- name: Channel anyT home-first AnyTLS service
  hosts: routers
  gather_facts: false
  vars_files:
    - ../group_vars/all.yml
    - ../group_vars/routers.yml
    - ../secrets/stealth.yml
  vars:
    channel_anytls_action: status
    channel_anytls_local_dir: "{{ playbook_dir }}/../out/channel-anytls"
    channel_anytls_remote_dir: /opt/etc/ghostroute-anytls
    channel_anytls_mutation_started: false
  tasks:
    - name: Validate explicit lab action
      ansible.builtin.assert:
        that: channel_anytls_action in ['start', 'stop', 'status', 'enable', 'disable', 'reconcile']

    - name: Read AnyTLS lab state only
      ansible.builtin.raw: >-
        if [ -f /opt/etc/ghostroute-anytls/channel-anytls.py ]; then
          /opt/bin/python3 /opt/etc/ghostroute-anytls/channel-anytls.py status;
        else printf '{"installed":false}\n'; fi
      changed_when: false
      when: channel_anytls_action == 'status'

    - name: Stop only AnyTLS lab
      ansible.builtin.raw: /opt/bin/python3 /opt/etc/ghostroute-anytls/channel-anytls.py stop
      when: channel_anytls_action == 'stop'

    - name: Disable only Channel anyT and its automatic recovery
      ansible.builtin.raw: /opt/bin/python3 /opt/etc/ghostroute-anytls/channel-anytls.py disable
      when: channel_anytls_action == 'disable'

    - name: Reconcile only an already enabled Channel anyT
      ansible.builtin.raw: /opt/bin/python3 /opt/etc/ghostroute-anytls/channel-anytls.py reconcile
      when: channel_anytls_action == 'reconcile'

    - name: Refuse replacing a running lab before entering startup rollback
      ansible.builtin.raw: test ! -f /tmp/ghostroute-anytls/owned.json
      changed_when: false
      when: channel_anytls_action == 'start'

    - name: Prepare and start the isolated AnyTLS lab
      when: channel_anytls_action in ['start', 'enable']
      block:
        - name: Verify approved imports before any mutation
          ansible.builtin.command:
            argv:
              - "{{ ansible_playbook_python }}"
              - "{{ playbook_dir }}/../../modules/routing-core/bin/channel-anytls-profile"
              - --verify-approved
              - "{{ channel_anytls_local_dir }}"
          delegate_to: localhost
          changed_when: false
          no_log: true

        - name: Production health gate before lab mutation
          ansible.builtin.include_tasks: ../tasks/channel-amn-health-gate.yml

        - name: Require prepared private identity bundle
          ansible.builtin.stat:
            path: "{{ channel_anytls_local_dir }}/settings.json"
          delegate_to: localhost
          register: channel_anytls_settings
          no_log: true

        - name: Reject absent client identity before router changes
          ansible.builtin.assert:
            that: channel_anytls_settings.stat.exists and channel_anytls_settings.stat.isreg
          no_log: true

        - name: Inspect existing Channel anyT identity before additive deployment
          ansible.builtin.stat:
            path: "{{ channel_anytls_remote_dir }}/settings.json"
          register: channel_anytls_existing

        - name: Capture previous identity without exposing credentials
          ansible.builtin.fetch:
            src: "{{ channel_anytls_remote_dir }}/settings.json"
            dest: "{{ channel_anytls_local_dir }}/previous.private.json"
            flat: true
          when: channel_anytls_existing.stat.exists
          no_log: true

        - name: Reject credential or ingress changes before stopping the service
          ansible.builtin.command:
            argv:
              - "{{ ansible_playbook_python }}"
              - "{{ playbook_dir }}/../../modules/routing-core/bin/channel-anytls-profile"
              - --check-update
              - "{{ channel_anytls_local_dir }}/previous.private.json"
              - "{{ channel_anytls_local_dir }}/settings.json"
          delegate_to: localhost
          when: channel_anytls_existing.stat.exists
          changed_when: false
          no_log: true

        - name: Verify existing protected production service before update
          ansible.builtin.command:
            argv:
              - bash
              - "{{ playbook_dir }}/../../modules/ghostroute-health-monitor/bin/channel-anyt-check"
          delegate_to: localhost
          changed_when: false
          when: channel_anytls_existing.stat.exists

        - name: Capture current production policy without changing its owner
          ansible.builtin.fetch:
            src: /opt/etc/sing-box/config.json
            dest: "{{ channel_anytls_local_dir }}/source.private.json"
            flat: true
          no_log: true

        - name: Restrict local captured credentials
          ansible.builtin.file:
            path: "{{ channel_anytls_local_dir }}/source.private.json"
            mode: '0600'
          delegate_to: localhost

        - name: Project the selected-client policy into an independent process
          ansible.builtin.command:
            argv:
              - "{{ ansible_playbook_python }}"
              - "{{ playbook_dir }}/../../modules/routing-core/router/channel-anytls-policy.py"
              - "{{ channel_anytls_local_dir }}/source.private.json"
              - "{{ channel_anytls_local_dir }}/settings.json"
              - "{{ channel_anytls_local_dir }}/policy.json"
          delegate_to: localhost
          no_log: true

        - name: Mark the beginning of scoped runtime changes
          ansible.builtin.set_fact:
            channel_anytls_mutation_started: true

        - name: Stop only the previous isolated process before installing its update
          ansible.builtin.raw: >-
            if [ -f /opt/etc/ghostroute-anytls/channel-anytls.py ]; then
              if [ -f /opt/etc/ghostroute-anytls/enabled ]; then
                /opt/bin/python3 /opt/etc/ghostroute-anytls/channel-anytls.py disable;
              else
                /opt/bin/python3 /opt/etc/ghostroute-anytls/channel-anytls.py stop;
              fi;
            fi
          no_log: true

        - name: Create private Entware lab directory
          ansible.builtin.file:
            path: "{{ channel_anytls_remote_dir }}"
            state: directory
            mode: '0700'

        - name: Install isolated lab identity and policy
          ansible.builtin.copy:
            src: "{{ channel_anytls_local_dir }}/{{ item }}"
            dest: "{{ channel_anytls_remote_dir }}/{{ item }}"
            mode: '0600'
          loop: [settings.json, policy.json, policy.source.sha256]
          no_log: true

        - name: Install Channel anyT lifecycle and policy projector
          ansible.builtin.copy:
            src: "{{ playbook_dir }}/../../modules/routing-core/router/{{ item }}"
            dest: "{{ channel_anytls_remote_dir }}/{{ item }}"
            mode: '0700'
          loop: [channel-anytls.py, channel-anytls-policy.py]

        - name: Install shared boot and firewall hooks with Channel anyT integration
          ansible.builtin.copy:
            src: "{{ playbook_dir }}/../../modules/routing-core/router/{{ item.src }}"
            dest: "{{ item.dest }}"
            mode: '0755'
            backup: true
          loop:
            - {src: ghostroute-runtime-supervisor, dest: /jffs/scripts/ghostroute-runtime-supervisor.sh}
            - {src: firewall-start, dest: /jffs/scripts/firewall-start}
          when: channel_anytls_action == 'enable'

        - name: Separate process name from production init ownership
          ansible.builtin.copy:
            remote_src: true
            src: /opt/bin/sing-box
            dest: "{{ channel_anytls_remote_dir }}/sing-box-atls"
            mode: '0700'

        - name: Validate exact binary syntax and unused resources
          ansible.builtin.raw: /opt/bin/python3 /opt/etc/ghostroute-anytls/channel-anytls.py preflight
          changed_when: false
          no_log: true

        - name: Start only AnyTLS lab and its scoped INPUT rule
          ansible.builtin.raw: "/opt/bin/python3 /opt/etc/ghostroute-anytls/channel-anytls.py {{ channel_anytls_action }}"
          no_log: true

        - name: Production health gate after lab mutation
          ansible.builtin.include_tasks: ../tasks/channel-amn-health-gate.yml

        - name: Verify authenticated Channel anyT after update
          ansible.builtin.command:
            argv:
              - bash
              - "{{ playbook_dir }}/../../modules/ghostroute-health-monitor/bin/channel-anyt-check"
          delegate_to: localhost
          changed_when: false
          when: channel_anytls_action == 'enable'
      rescue:
        - name: Contain the failed AnyTLS lab only
          ansible.builtin.raw: >-
            if [ -f /opt/etc/ghostroute-anytls/channel-anytls.py ]; then
              /opt/bin/python3 /opt/etc/ghostroute-anytls/channel-anytls.py disable;
            fi
          no_log: true
          when: channel_anytls_mutation_started | bool
        - name: Report isolated lab startup failure
          ansible.builtin.fail:
            msg: Channel anyT deployment failed; inspect private evidence and runtime status before retrying.

- name: Preflight router for Channel C1 home Naive lane
  hosts: routers
  gather_facts: false
  vars_files:
    - ../group_vars/all.yml
    - ../group_vars/routers.yml
    - ../secrets/stealth.yml
  tasks:
    - name: GhostRoute deploy gate before Channel C router mutation
      ansible.builtin.include_tasks: ../tasks/deploy-gate.yml

    - name: Channel C1 home lane is enabled
      ansible.builtin.assert:
        that:
          - channel_c_home_enabled | default(false) | bool
        fail_msg: "Set vault_channel_c_home_enabled=true before running 22-channel-c-router.yml."

    - name: Ensure bash + python3 via opkg
      ansible.builtin.raw: |
        /opt/bin/opkg list-installed | grep -q '^bash ' || /opt/bin/opkg install bash
        /opt/bin/opkg list-installed | grep -q '^python3 ' || /opt/bin/opkg install python3
      changed_when: false

    - name: Fail fast if a Channel C public TCP/443 endpoint is owned outside C1 redirects
      ansible.builtin.raw: |
        if netstat -nlp 2>/dev/null | awk '$4 ~ /(^|[.:])443$/ { found = 1 } END { exit(found ? 0 : 1) }'; then
          if ! iptables -t nat -S PREROUTING | awk '
            index($0, "--dport 443 ") && index($0, "-j REDIRECT") &&
            (index($0, "--to-ports {{ channel_c_home_ingress_port }}") || index($0, "--to-ports {{ channel_c_shadowrocket_ingress_port }}")) {
              c1_redirect = 1
            }
            END { exit !c1_redirect }
          '; then
            echo "TCP/443 is already listening on the router without an existing C1 redirect; choose another Channel C public endpoint or disable the conflicting WAN service." >&2
            exit 1
          fi
        fi
      changed_when: false
      when:
        - (channel_c_home_public_port | int == 443) or (channel_c_shadowrocket_public_port | int == 443)
        - channel_c_home_ingress_port | int != 443
        - channel_c_shadowrocket_ingress_port | int != 443

- name: Deploy Channel C1 home-first Naive lane on router
  hosts: routers
  gather_facts: true
  vars_files:
    - ../group_vars/all.yml
    - ../group_vars/routers.yml
    - ../secrets/stealth.yml
  pre_tasks:
    - name: Capture last-known-good router runtime before Channel C deploy
      ansible.builtin.include_tasks: ../tasks/router-last-good-backup.yml
  roles:
    - singbox_client
    - stealth_routing
  post_tasks:
    - name: Refresh sing-box rule-sets after Channel C1 deploy
      ansible.builtin.raw: >
        MANAGED_DNS_FORWARD_HOST='{{ router_managed_dns_forward_host | default("127.0.0.1") }}'
        MANAGED_DNS_FORWARD_PORT='{{ router_managed_dns_forward_port | default(dnscrypt_port) }}'
        /jffs/scripts/update-singbox-rule-sets.sh --no-restart
      changed_when: false

    - name: Restart sing-box after Channel C1 deploy
      ansible.builtin.raw: |
        {{ singbox_init_path }} restart
        sleep 3
      changed_when: false

    - name: Re-apply stealth routing after Channel C1 restart
      ansible.builtin.raw: "{{ stealth_route_init_script }}"
      changed_when: false

    - name: Reconcile GhostRoute runtime supervisor after Channel C deploy
      ansible.builtin.raw: "{{ ghostroute_runtime_supervisor_path }} recover"
      changed_when: false

    - name: Channel C1 native Naive listener is running
      ansible.builtin.raw: "netstat -nlp 2>/dev/null | grep -q '0.0.0.0:{{ channel_c_home_ingress_port }}'"
      changed_when: false

    - name: Channel C1 native public port has exactly one redirect to internal Naive listener when needed
      ansible.builtin.raw: |
        iptables -t nat -S PREROUTING |
          awk '
            index($0, "-i {{ wan_if }} ") && index($0, "--dport {{ channel_c_home_public_port }} ") && index($0, "-j REDIRECT") {
              redirects++
              if (index($0, "--to-ports {{ channel_c_home_ingress_port }}")) expected++
            }
            END { exit !(redirects == 1 && expected == 1) }
          '
      changed_when: false
      when: channel_c_home_public_port | string != channel_c_home_ingress_port | string

    - name: C1-Shadowrocket compatibility listener is running when enabled
      ansible.builtin.raw: "netstat -nlp 2>/dev/null | grep -q '0.0.0.0:{{ channel_c_shadowrocket_ingress_port }}'"
      changed_when: false
      when: channel_c_shadowrocket_enabled | default(false) | bool

    - name: Channel C1 Shadowrocket listener serves a current TLS certificate when enabled
      ansible.builtin.raw: |
        timeout 8 openssl s_client -connect 127.0.0.1:{{ channel_c_shadowrocket_ingress_port }} </dev/null 2>/dev/null |
          openssl x509 -noout -checkend 0 >/dev/null
      changed_when: false
      when: channel_c_shadowrocket_enabled | default(false) | bool
      no_log: true

    - name: C1-Shadowrocket public port has exactly one redirect to internal HTTP listener when needed
      ansible.builtin.raw: |
        iptables -t nat -S PREROUTING |
          awk '
            index($0, "-i {{ wan_if }} ") && index($0, "--dport {{ channel_c_shadowrocket_public_port }} ") && index($0, "-j REDIRECT") {
              redirects++
              if (index($0, "--to-ports {{ channel_c_shadowrocket_ingress_port }}")) expected++
            }
            END { exit !(redirects == 1 && expected == 1) }
          '
      changed_when: false
      when:
        - channel_c_shadowrocket_enabled | default(false) | bool
        - channel_c_shadowrocket_public_port | string != channel_c_shadowrocket_ingress_port | string

    - name: GhostRoute deploy gate after Channel C router mutation
      ansible.builtin.include_tasks: ../tasks/deploy-gate.yml

---
# Surgical, Hermes-only change: add ONE exact-SNI web route to the outer Caddy
# layer4 config and recreate ONLY the caddy container. It does NOT touch Xray,
# UFW, the Docker network, unbound or any other role. Safety: GhostRoute deploy
# gate before/after, live Caddyfile backup, config validation inside the caddy
# image before recreate, and automatic rollback to the backup on any failure.
#
# Web SNI hostnames are read from the app-owned stack envs
# (/opt/cheap-intelligence/.env DIGEST_HOSTNAME and, when present,
# /opt/career-copilot/.env CC_PUBLIC_HOST) so the outer routes and the inner app
# Caddies always agree, and no IP is committed to git. Each route is exact-SNI to
# its own loopback upstream; unmatched SNI keeps falling through to Xray.
- name: Hermes outer Caddy — add app web SNI route (surgical, caddy-only)
  hosts: vps_egress_hermes
  become: true
  gather_facts: true
  vars_files:
    - ../group_vars/all.yml
    - ../group_vars/vps_stealth.yml
    - ../secrets/stealth.yml
  vars:
    stealth_stack_dir: /opt/stealth
    stealth_caddy_mode: docker_sidecar
    ci_env_path: /opt/cheap-intelligence/.env
    cc_env_path: /opt/career-copilot/.env
  pre_tasks:
    - name: GhostRoute deploy gate (before)
      ansible.builtin.include_tasks: ../tasks/deploy-gate.yml

    - name: Read app stack env for the digest hostname
      ansible.builtin.slurp:
        src: "{{ ci_env_path }}"
      register: _ci_env
      no_log: true

    - name: Derive caddy_l4_web_sni_host from DIGEST_HOSTNAME
      ansible.builtin.set_fact:
        caddy_l4_web_sni_host: "{{ (_ci_env['content'] | b64decode) | regex_search('^DIGEST_HOSTNAME=\\S+', multiline=True) | default('', true) | regex_replace('^DIGEST_HOSTNAME=', '') | trim }}"
      no_log: true

    - name: Sanity-check derived hostname shape
      ansible.builtin.assert:
        that:
          - caddy_l4_web_sni_host is match('^digest\\.[0-9-]+\\.sslip\\.io$')
        fail_msg: "Derived web SNI host is not a digest.<ip-dashed>.sslip.io hostname."
      no_log: true

    - name: Check for the Career Copilot app stack env
      ansible.builtin.stat:
        path: "{{ cc_env_path }}"
      register: _cc_env_stat

    - name: Read Career Copilot stack env
      ansible.builtin.slurp:
        src: "{{ cc_env_path }}"
      register: _cc_env
      when: _cc_env_stat.stat.exists
      no_log: true

    - name: Derive Career Copilot gateway route
      ansible.builtin.set_fact:
        _cc_host: "{{ (_cc_env['content'] | b64decode) | regex_search('^CC_PUBLIC_HOST=\\S+', multiline=True) | default('', true) | regex_replace('^CC_PUBLIC_HOST=', '') | trim }}"
        _cc_port: "{{ (_cc_env['content'] | b64decode) | regex_search('^CC_GATEWAY_PORT=[0-9]+', multiline=True) | default('CC_GATEWAY_PORT=8445', true) | regex_replace('^CC_GATEWAY_PORT=', '') | trim }}"
      when: _cc_env_stat.stat.exists
      no_log: true

    - name: Sanity-check Career Copilot route shape
      ansible.builtin.assert:
        that:
          - _cc_host is match('^career\\.[0-9-]+\\.sslip\\.io$')
          - _cc_host != caddy_l4_web_sni_host
          - _cc_host != reality_server_names[0]
          - (_cc_port | int) >= 1024 and (_cc_port | int) <= 65535
          - (_cc_port | int) not in [xray_reality_listen_port | int, 8444]
        fail_msg: "Career Copilot route must be career.<ip-dashed>.sslip.io to a free loopback port."
      when: _cc_env_stat.stat.exists and (_cc_host | default('') | length > 0)
      no_log: true

    - name: Register Career Copilot as an extra exact-SNI route
      ansible.builtin.set_fact:
        caddy_l4_extra_web_routes:
          - name: career_copilot
            sni_host: "{{ _cc_host }}"
            upstream: "127.0.0.1:{{ _cc_port }}"
      when: _cc_env_stat.stat.exists and (_cc_host | default('') | length > 0)
      no_log: true

  tasks:
    - name: Backup live outer Caddyfile
      ansible.builtin.copy:
        src: "{{ stealth_stack_dir }}/caddy/Caddyfile"
        dest: "{{ stealth_stack_dir }}/caddy/Caddyfile.bak-{{ ansible_facts['date_time']['iso8601_basic_short'] }}"
        remote_src: true
        mode: "0644"
      register: _caddy_backup

    - name: Apply new Caddyfile with validation and rollback
      block:
        - name: Render outer Caddyfile with app web SNI route
          ansible.builtin.template:
            src: "{{ playbook_dir }}/../roles/caddy_l4/templates/Caddyfile.j2"
            dest: "{{ stealth_stack_dir }}/caddy/Caddyfile"
            mode: "0644"
          register: _caddy_render

        - name: Validate new Caddyfile inside the caddy-l4 image
          ansible.builtin.command:
            argv:
              - docker
              - run
              - --rm
              - --entrypoint
              - caddy
              - -v
              - "{{ stealth_stack_dir }}/caddy/Caddyfile:/etc/caddy/Caddyfile:ro"
              - "{{ caddy_image_tag }}"
              - validate
              - --config
              - /etc/caddy/Caddyfile
              - --adapter
              - caddyfile
          changed_when: false

        - name: Recreate ONLY the caddy container
          community.docker.docker_compose_v2:
            project_src: "{{ stealth_stack_dir }}"
            services: [caddy]
            state: present
            recreate: always
          when: _caddy_render is changed

        - name: Settle
          ansible.builtin.pause:
            seconds: 4

        - name: Confirm outer Caddy is serving :443 again
          ansible.builtin.wait_for:
            host: 127.0.0.1
            port: 443
            timeout: 20

      rescue:
        - name: Rollback Caddyfile from backup
          ansible.builtin.copy:
            src: "{{ _caddy_backup.dest }}"
            dest: "{{ stealth_stack_dir }}/caddy/Caddyfile"
            remote_src: true
            mode: "0644"

        - name: Recreate caddy with restored config
          community.docker.docker_compose_v2:
            project_src: "{{ stealth_stack_dir }}"
            services: [caddy]
            state: present
            recreate: always

        - name: Fail after rollback
          ansible.builtin.fail:
            msg: "Caddy web-route apply failed; rolled back to backup Caddyfile."

  post_tasks:
    - name: GhostRoute deploy gate (after)
      ansible.builtin.include_tasks: ../tasks/deploy-gate.yml

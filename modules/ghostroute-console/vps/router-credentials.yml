---
- name: Configure dedicated Console router access
  when: console_router_remote_host | length > 0
  block:
    - name: Inspect only the dedicated local service key
      ansible.builtin.stat:
        path: "{{ console_router_remote_key_src }}"
      delegate_to: localhost
      become: false
      register: console_router_service_key
      no_log: true

    - name: Require a separate service credential and verified host pins
      ansible.builtin.assert:
        that:
          - console_router_remote_key_content | length > 0 or console_router_service_key.stat.exists
          - console_router_known_hosts_content | length > 0
          - vault_console_router_public_key is defined
          - vault_router_management_operator_public_key is defined
          - vault_console_router_public_key.split()[1] != vault_router_management_operator_public_key.split()[1]
          - console_router_remote_key_content | length == 0 or console_router_remote_key_content != (ghostroute_router_remote_private_key | default(''))
        fail_msg: Console router access requires its dedicated restricted key and verified host pins; operator-key fallback is forbidden.
      no_log: true

    - name: Create private router credential directory
      ansible.builtin.file:
        path: "{{ console_root }}/router-ssh"
        state: directory
        mode: '0550'
        owner: root
        group: "{{ console_readonly_user }}"

    - name: Install dedicated router service key from Vault
      ansible.builtin.copy:
        content: "{{ console_router_remote_key_content }}"
        dest: "{{ console_root }}/router-ssh/console_router_ed25519"
        owner: "{{ console_readonly_user }}"
        group: "{{ console_readonly_user }}"
        mode: '0400'
      when: console_router_remote_key_content | length > 0
      no_log: true

    - name: Install dedicated router service key from local secret storage
      ansible.builtin.copy:
        src: "{{ console_router_remote_key_src }}"
        dest: "{{ console_root }}/router-ssh/console_router_ed25519"
        owner: "{{ console_readonly_user }}"
        group: "{{ console_readonly_user }}"
        mode: '0400'
      when: console_router_remote_key_content | length == 0
      no_log: true

    - name: Install verified router host pins
      ansible.builtin.copy:
        content: "{{ console_router_known_hosts_content }}"
        dest: "{{ console_root }}/router-ssh/known_hosts"
        owner: root
        group: "{{ console_readonly_user }}"
        mode: '0440'
      no_log: true

    - name: Keep Console operator metadata on the VPS
      ansible.builtin.file:
        path: "{{ console_root }}/operator-state"
        state: directory
        owner: "{{ console_readonly_user }}"
        group: "{{ console_readonly_user }}"
        mode: '0700'

    - name: Verify the installed service key identity
      ansible.builtin.command:
        argv: [ssh-keygen, -y, -P, '', -f, "{{ console_root }}/router-ssh/console_router_ed25519"]
      register: console_router_service_public
      changed_when: false
      failed_when: console_router_service_public.rc != 0 or console_router_service_public.stdout.split()[1] != vault_console_router_public_key.split()[1]
      no_log: true

    - name: Prove router authentication and forced-command rejection before selecting the key
      ansible.builtin.command:
        argv:
          - ssh
          - -F
          - /dev/null
          - -i
          - "{{ console_root }}/router-ssh/console_router_ed25519"
          - -p
          - "{{ console_router_remote_port | string }}"
          - -o
          - BatchMode=yes
          - -o
          - IdentitiesOnly=yes
          - -o
          - IdentityAgent=none
          - -o
          - ControlMaster=no
          - -o
          - ControlPath=none
          - -o
          - StrictHostKeyChecking=yes
          - -o
          - "UserKnownHostsFile={{ console_root }}/router-ssh/known_hosts"
          - -o
          - ConnectTimeout=8
          - "{{ console_router_remote_user }}@{{ console_router_remote_host }}"
          - "{{ item.command }}"
      loop:
        - {command: 'true', expected: 0}
        - {command: id, expected: 126}
      register: console_router_service_proof
      changed_when: false
      failed_when: console_router_service_proof.rc != item.expected
      no_log: true

    - name: Select the dedicated service credential atomically
      ansible.builtin.copy:
        dest: "{{ console_root }}/router.env"
        owner: root
        group: "{{ console_readonly_user }}"
        mode: '0440'
        content: |
          ROUTER={{ console_router_remote_host | quote }}
          ROUTER_PORT={{ console_router_remote_port | quote }}
          ROUTER_USER={{ console_router_remote_user | quote }}
          ROUTER_ACCESS_MODE=wan
          CONNECT_TIMEOUT=8
          SSH_IDENTITY_FILE={{ (console_root ~ '/router-ssh/console_router_ed25519') | quote }}
          SSH_HOST_KEY_ALGORITHMS=+ssh-rsa
          SSH_STRICT_HOST_KEY_CHECKING=yes
          SSH_KNOWN_HOSTS_FILE={{ (console_root ~ '/router-ssh/known_hosts') | quote }}
          SSH_PROXY_JUMP=
          SSH_CONFIG_FILE=
          GHOSTROUTE_ALARM_STATE_FILE={{ (console_root ~ '/operator-state/alarm-state.json') | quote }}
          GHOSTROUTE_ROUTER_ENV_FILE={{ (console_root ~ '/router.env') | quote }}
      no_log: true

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  repo-checks:
    name: Repo checks
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Python
        uses: actions/setup-python@v7.1.0
        with:
          python-version: "3.15.2"

      - name: Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "26.13.1"
          cache: npm
          cache-dependency-path: modules/ghostroute-console/app/package-lock.json

      - name: Install Console dependencies
        run: npm --prefix modules/ghostroute-console/app ci

      - name: Install repo check tools
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: Install routing fixture dependencies
        run: python -m pip install -r ansible/requirements.txt

      - name: Fast repo checks
        run: ./tests/run-fast.sh

  console-smoke:
    name: Console smoke
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "26.13.1"
          cache: npm
          cache-dependency-path: modules/ghostroute-console/app/package-lock.json

      - name: Install Console dependencies
        run: npm --prefix modules/ghostroute-console/app ci

      - name: Install Playwright Chromium
        run: npm --prefix modules/ghostroute-console/app exec -- playwright install --with-deps chromium

      - name: Console smoke tests
        run: ./tests/run-smoke.sh

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: console-playwright-traces
          path: |
            modules/ghostroute-console/app/test-results/
            modules/ghostroute-console/app/playwright-report/
          if-no-files-found: ignore

  console-performance:
    name: Console performance
    runs-on: ubuntu-latest
    if: github.event_name == 'workflow_dispatch'
    steps:
      - name: Check out repository
        uses: actions/checkout@v7.0.1

      - name: Set up Node
        uses: actions/setup-node@v7.1.0
        with:
          node-version: "26.13.1"
          cache: npm
          cache-dependency-path: modules/ghostroute-console/app/package-lock.json

      - name: Install Console dependencies
        run: npm --prefix modules/ghostroute-console/app ci

      - name: Install Playwright Chromium
        run: npm --prefix modules/ghostroute-console/app exec -- playwright install --with-deps chromium

      - name: Console performance tests
        run: npm --prefix modules/ghostroute-console/app run test:perf

      - name: Upload Playwright performance traces
        if: failure()
        uses: actions/upload-artifact@v7.0.2
        with:
          name: console-performance-traces
          path: |
            modules/ghostroute-console/app/test-results/
            modules/ghostroute-console/app/playwright-report/
          if-no-files-found: ignore
